AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
# DAG conformance suite (10-1..10-4). Each function maps to a requirement id via
# TestingMetadata.TestDescription and is exercised by the language-neutral
# conformance runner against the shared test-requirements/dag/*.yaml contract.
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 60
    MemorySize: 128
Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            - lambda:InvokeFunction
            Resource: '*'
  TargetEcho:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    Properties:
      CodeUri: ./dist
      Handler: target_echo.handler
      Description: Echo target function — returns whatever it receives
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagDiamond:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-1"]
    Properties:
      CodeUri: ./dist
      Handler: dag_diamond.handler
      Description: DAG diamond fan-out/fan-in, all tasks complete (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagCompensation:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-2"]
    Properties:
      CodeUri: ./dist
      Handler: dag_compensation.handler
      Description: DAG trigger-rule compensation (COMPLETED_WITH_FAILURES)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagRunIf:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-3"]
    Properties:
      CodeUri: ./dist
      Handler: dag_runif.handler
      Description: DAG per-task conditional execution (runIf skips emit no events)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagWaitResume:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-4"]
    Properties:
      CodeUri: ./dist
      Handler: dag_wait_resume.handler
      Description: DAG in-graph Wait task suspends and resumes (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagChild:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-5"]
    Properties:
      CodeUri: ./dist
      Handler: dag_child.handler
      Description: DAG task that is a runInChildContext with inner steps (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagMap:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-6"]
    Properties:
      CodeUri: ./dist
      Handler: dag_map.handler
      Description: DAG task that is a map over a fixed item list (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagParallel:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-7"]
    Properties:
      CodeUri: ./dist
      Handler: dag_parallel.handler
      Description: DAG task that is a parallel of two named branches (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagWaitForCondition:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-8"]
    Properties:
      CodeUri: ./dist
      Handler: dag_wait_for_condition.handler
      Description: DAG task that is a waitForCondition polling to threshold (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagNested:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-9"]
    Properties:
      CodeUri: ./dist
      Handler: dag_nested.handler
      Description: DAG task that is itself a nested DAG / sub-dag (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagInvoke:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-10"]
    Properties:
      CodeUri: ./dist
      Handler: dag_invoke.handler
      Description: DAG task that is an invoke of the echo target (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          TARGET_FUNCTION_NAME: !Sub "${TargetEcho.Arn}:$LATEST"
  DagCallback:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-11"]
    Properties:
      CodeUri: ./dist
      Handler: dag_callback.handler
      Description: DAG task that is a waitForCallback completed externally (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagRunIfAbort:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-12"]
    Properties:
      CodeUri: ./dist
      Handler: dag_run_if_abort.handler
      Description: DAG runIf abort — a throwing predicate FAILS the DAG (ContextFailed SubType=Dag)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagConcurrentOverlap:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-13"]
    Properties:
      CodeUri: ./dist
      Handler: dag_concurrent_overlap.handler
      Description: DAG concurrent overlap — real in-flight overlap, outcome-only assertions (peakConcurrency=2)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagConcurrentSuspend:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-14"]
    Properties:
      CodeUri: ./dist
      Handler: dag_concurrent_suspend.handler
      Description: DAG concurrent suspend — inverted readiness across a suspend, two waits in flight (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
