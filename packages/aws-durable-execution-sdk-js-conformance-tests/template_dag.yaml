AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
# DAG conformance suite (10-1..10-4). Each function maps to a requirement id via
# TestingMetadata.TestDescription and is exercised by the language-neutral
# conformance runner against the shared test-requirements/dag/*.yaml contract.
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 60
    MemorySize: 128
Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            Resource: '*'
  DagDiamond:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-1"]
    Properties:
      CodeUri: ./dist
      Handler: dag_diamond.handler
      Description: DAG diamond fan-out/fan-in, all tasks complete (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagCompensation:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-2"]
    Properties:
      CodeUri: ./dist
      Handler: dag_compensation.handler
      Description: DAG trigger-rule compensation (COMPLETED_WITH_FAILURES)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagRunIf:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-3"]
    Properties:
      CodeUri: ./dist
      Handler: dag_runif.handler
      Description: DAG per-task conditional execution (runIf skips emit no events)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagWaitResume:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-4"]
    Properties:
      CodeUri: ./dist
      Handler: dag_wait_resume.handler
      Description: DAG in-graph Wait task suspends and resumes (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
