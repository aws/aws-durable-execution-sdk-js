AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 60
    MemorySize: 128
Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            Resource: '*'
  PluginInvocationLifecycle:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-1"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_invocation_lifecycle.handler
      Description: Plugin invocation lifecycle hooks (start and end on a single invocation)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginOperationLifecycle:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-2"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_operation_lifecycle.handler
      Description: Plugin operation lifecycle hooks (step start and terminal end)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginAttemptHooksRetry:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-3"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_attempt_hooks_retry.handler
      Description: Plugin attempt hooks fire per step attempt with attempt number and outcome
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginErrorIsolation:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-4"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_error_isolation.handler
      Description: Plugin exceptions are swallowed and never affect the execution outcome
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginMultiplePlugins:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-5"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_multiple_plugins.handler
      Description: Multiple registered plugins all receive lifecycle hooks
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginFirstInvocationFlag:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-6"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_first_invocation_flag.handler
      Description: Plugin sees is-first-invocation true once, then false on replay
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginTerminalFailure:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-7"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_terminal_failure.handler
      Description: Plugin invocation-end hook receives FAILED status when execution fails
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginOperationChange:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-8"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_operation_change.handler
      Description: Plugin operation-change hook reports updated operations and the full map
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginExternalUpdateOnInvoke:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-9"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_external_update_on_invoke.handler
      Description: Plugin sees a wait completed externally between invocations as an updated operation
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginWaitOperationHooks:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-10"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_wait_operation_hooks.handler
      Description: Plugin operation-start and operation-end hooks fire for wait-type operations
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginNestedParentLinkage:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-11"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_nested_parent_linkage.handler
      Description: Plugin operation hooks report parent id for a step nested in a child context
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginParallelBranchHooks:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-12"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_parallel_branch_hooks.handler
      Description: Plugin user-function hooks fire per parallel branch with parent linkage
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginReplayFlags:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-13"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_replay_flags.handler
      Description: Non-terminal operations replay with replay=true; terminal operations are not re-emitted
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginTerminalPayloads:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-14"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_terminal_payloads.handler
      Description: Operation-end info carries the checkpointed result on success and the error on failure
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginRetryExhaustion:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-15"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_retry_exhaustion.handler
      Description: Attempt hooks fire for every attempt until exhaustion, then operation-end reports FAILED
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginSuspensionInvocationEnd:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-16"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_suspension_invocation_end.handler
      Description: Invocation-end fires for every invocation, non-terminal on suspension and terminal at completion
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginFaultyAndHealthy:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-17"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_faulty_and_healthy.handler
      Description: A plugin that throws in every hook never blocks another plugin's hooks or the execution
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginSlowHookFlush:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-18"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_slow_hook_flush.handler
      Description: Slow work in a plugin hook completes and its record is emitted before the invocation ends
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginWaitReplayFlag:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: "True"
    TestingMetadata:
      TestDescription: ["10-19"]
    Properties:
      CodeUri: ./dist
      Handler: plugin_wait_replay_flag.handler
      Description: A wait still pending during a replay re-fires operation-start with replay=true
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
