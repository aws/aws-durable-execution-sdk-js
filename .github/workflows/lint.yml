name: Lint

on:
  workflow_call:

permissions:
  contents: read # Required for actions/checkout

# No concurrency block here on purpose. build.yml, the only caller, already sets
# workflow-level concurrency with cancel-in-progress, which governs the jobs of a
# called workflow. A group of its own would be redundant -- and including
# github.run_id in one, as the other reusable workflows do, makes the group unique
# per run so cancel-in-progress can never match anything.

env:
  # See the note in build.yml: the desktop app's `electron` devDependency
  # downloads a ~100 MB binary that no lint job needs.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # Everything Biome: formatting and linting for the whole monorepo, the Prettier
  # pass for the two languages Biome cannot format, and the diff-scoped
  # async-safety annotations.
  #
  # These share one job because they share one `npm ci`, which is the expensive
  # part. The same argument removed a duplicate boundary-lint step from the
  # insight-hosts job in build.yml, so it applies here too.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The async-safety step below uses `biome lint --changed`, which diffs
          # against the base branch and therefore needs real history. This also
          # fetches every branch, so no extra `git fetch` is required -- and adding
          # one with --depth=1 would convert the full clone into a shallow one
          # (verified: it writes .git/shallow), risking merge-base resolution for no
          # benefit.
          fetch-depth: 0
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      # Gates on errors only. `biome ci` auto-detects GitHub Actions and turns
      # every diagnostic into an inline PR annotation, and this repo carries ~1030
      # warnings and infos that are almost all pre-existing -- unfiltered, that
      # buries a PR in review noise about lines it never touched.
      #
      # This does NOT weaken enforcement. Formatting violations and lint errors
      # are both error-severity, so both still fail here; only warnings and infos
      # are withheld from annotations. They are reported in the summary step below.
      - name: Biome (format + lint)
        run: npm run ci

      # Prettier owns Markdown and YAML, which Biome cannot format. Checked here so
      # documentation and workflow files cannot drift, which was the one outright
      # loss in the ESLint/Prettier removal rather than a tradeoff.
      - name: Prettier (Markdown + YAML)
        run: npm run format:docs:check

      # Async-safety rules, annotated on the diff only.
      #
      # noFloatingPromises / noMisusedPromises / useAwaitThenable recover the async
      # coverage the testing package lost with `strictTypeChecked`. They are "warn",
      # so the gating step above (--diagnostic-level=error) neither annotates nor
      # fails on them -- which would leave them with no CI signal at all.
      #
      # `--changed` limits this to files the PR actually touched, so a NEW floating
      # promise is annotated inline while the 77-violation backlog is not. On the
      # migration branch that is 2 annotations instead of 77.
      #
      # Fails loudly if the base ref is missing: the script passes
      # --no-errors-on-unmatched (required so a docs-only PR, which changes nothing
      # Biome lints, does not exit 1), and that flag also masks a bad base ref. This
      # check is therefore the only thing standing between a missing base ref and a
      # step that reports nothing while passing.
      #
      # --since is passed explicitly so PRs targeting v1.x compare against v1.x
      # rather than the configured default of origin/main.
      - name: Annotate async-safety warnings on changed files
        # Runs even when the gating steps above fail. As a separate job this executed
        # unconditionally; folding it into this job made it skip on any earlier
        # failure, so a PR with both a formatting error and a new floating promise
        # would only learn about the promise on the next push. success() || failure()
        # restores that without reviving the extra `npm ci`. always() would be wrong:
        # it would also run after a failed `npm ci`, with no dependencies installed.
        if: success() || failure()
        run: |
          BASE="origin/${GITHUB_BASE_REF:-main}"
          if ! git rev-parse --verify -q "$BASE" >/dev/null; then
            echo "::error::Base ref $BASE not found. '--changed' cannot compute a diff."
            exit 1
          fi
          echo "Diffing against $BASE ($(git rev-parse --short "$BASE"))"
          npm run lint:async-safety --silent -- --since="$BASE" --reporter=github

      # Fails on any suppression that suppresses nothing.
      #
      # `suppressions/unused` is warning-severity and is not a configurable lint
      # rule, so the `biome ci --diagnostic-level=error` gate above filters it out.
      # Two suppressions in this migration were dead for exactly that reason -- one
      # with its reason wrapped onto a second line, one where a refactor moved the
      # violation out of the rule's view entirely -- and nothing caught either. An
      # unused suppression means either the rationale suppresses nothing or a finding
      # left the backlog silently, so it gets its own gate.
      - name: Biome (no dead suppressions)
        if: success() || failure()
        run: npm run lint:suppressions --silent

      # Informational only, never gating: renders the warning backlog as a
      # per-rule table in the job summary so it stays visible without annotating
      # individual lines.
      - name: Biome warning backlog (informational)
        if: always()
        run: npm run lint:report --silent >> "$GITHUB_STEP_SUMMARY"

  # The repo's own published lint rules, run against the examples.
  #
  # Separate from the job above because it is a different toolchain: Biome cannot
  # host ESLint plugins, and this needs the plugin compiled first.
  # `no-nested-durable-operations` catches a real bug class (a durable operation
  # nested inside a step never checkpoints correctly), and the examples are the code
  # customers copy, so the rule needs to run on more than the plugin's own
  # RuleTester fixtures.
  durable-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build the ESLint plugin
        run: npm run build -w packages/aws-durable-execution-sdk-js-eslint-plugin
      - name: Check examples against our own durable-function rules
        run: npm run lint:durable-rules -w packages/aws-durable-execution-sdk-js-examples
