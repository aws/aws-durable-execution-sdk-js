name: Stale Issue Closer

on:
  schedule:
    # GitHub may delay or drop scheduled workflows during high-load periods.
    # Avoid scheduling at the top of the hour.
    - cron: "37 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close-stale:
    permissions:
      contents: read
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/stale-issue-closer.yml@1ce65d9d6bf531169718a5e967e15d72fc958265
    with:
      days-until-close: 14
      close-reason: not_planned
