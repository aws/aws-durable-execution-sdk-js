name: Stale Issue Closer

on:
  schedule:
    # GitHub may delay or drop scheduled workflows during high-load periods.
    # Avoid scheduling at the top of the hour.
    - cron: "37 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close-stale:
    permissions:
      contents: read
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/stale-issue-closer.yml@70105676c3ff29ae3e2c1681ac7e8cebdaca5a6e
    with:
      days-until-close: 14
      close-reason: not_planned
