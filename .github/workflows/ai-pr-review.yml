name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  ai-pr-review:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: aws/aws-durable-execution-ci/.github/workflows/ai-pr-review.yml@4c98745db4fad4ba2176b2dcf40d6af3a8a39b78
    with:
      prompt-path: .github/prompts/ai-pr-review.md
    secrets: inherit
