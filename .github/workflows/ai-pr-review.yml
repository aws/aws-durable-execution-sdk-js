name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  ai-pr-review:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: aws/aws-durable-execution-ci/.github/workflows/ai-pr-review.yml@8ea82196db65b5b0dd67f0b72bb03fa2fa9cf65b
    with:
      # CodeBuild-hosted runner in the JavaScript testing account; the label must
      # match the CodeBuild project name.
      runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
      prompt-path: .github/prompts/ai-pr-review.md
      run-claude: false
    secrets: inherit
