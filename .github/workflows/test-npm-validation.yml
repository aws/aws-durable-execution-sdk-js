name: Test NPM Publish Validation

on:
  pull_request:
    paths:
      - '.github/workflows/iterate-publish-npm.sh'
      - '.github/workflows/npm-publish.yml'
      - '.github/workflows/scripts/test-publish/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-validation-logic:
    name: Test validation and verification logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup mock npm and test packages
        shell: bash
        run: |
          set -euo pipefail
          
          # Setup mock npm
          mkdir -p "$RUNNER_TEMP/mock-bin"
          ln -s "$GITHUB_WORKSPACE/.github/workflows/scripts/test-publish/mock-npm.js" \
                "$RUNNER_TEMP/mock-bin/npm"
          : > "$RUNNER_TEMP/npm-args.log"
          
          # Create test packages
          mkdir -p packages/test-stable packages/test-prerelease packages/test-other
          
          # Stable package (should go to latest)
          cat > packages/test-stable/package.json << 'EOF'
          {"name": "test-stable", "version": "2.0.0"}
          EOF
          
          # Pre-release package (should go to beta)  
          cat > packages/test-prerelease/package.json << 'EOF'
          {"name": "test-prerelease", "version": "2.1.0-alpha.1"}
          EOF
          
          # Another stable package
          cat > packages/test-other/package.json << 'EOF'
          {"name": "test-other", "version": "1.5.0"}
          EOF
          
          {
            echo "NPM_LOG=$RUNNER_TEMP/npm-args.log"
            echo "ASSERT_RESULT_PATH=$RUNNER_TEMP/assert-result.json"
          } >> "$GITHUB_ENV"

      - name: Test validation logic
        shell: bash
        run: |
          # Source the script to get functions without executing main
          source .github/workflows/iterate-publish-npm.sh
          
          echo "Testing pre-release validation..."
          
          # Test 1: Pre-release to latest should fail
          cd packages/test-prerelease
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          
          TEST_MODE=1 PRERELEASE=false
          if check_prerelease_version "$VERSION" "$PACKAGE_NAME"; then
            echo "ERROR: Pre-release to latest should fail"
            exit 1
          else
            echo "✓ Pre-release correctly blocked from latest tag"
          fi
          
          # Test 2: Pre-release to beta should pass
          TEST_MODE=1 PRERELEASE=true
          if check_prerelease_version "$VERSION" "$PACKAGE_NAME"; then
            echo "✓ Pre-release correctly allowed to beta tag"  
          else
            echo "ERROR: Pre-release to beta should pass"
            exit 1
          fi
          
          # Test 3: Stable to latest should pass
          cd ../test-stable
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          
          TEST_MODE=1 PRERELEASE=false
          if check_prerelease_version "$VERSION" "$PACKAGE_NAME"; then
            echo "✓ Stable version correctly allowed to latest tag"
          else
            echo "ERROR: Stable to latest should pass"
            exit 1
          fi

      - name: Test end-to-end publish flow
        shell: bash  
        run: |
          # Test the actual publish commands with mocks
          PATH="$RUNNER_TEMP/mock-bin:$PATH" \
          SKIP_DIST_TAG_VERIFY=1 \
          PRERELEASE=true \
            bash .github/workflows/iterate-publish-npm.sh