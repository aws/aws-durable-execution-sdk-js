name: Unit Tests

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

permissions:
  contents: read # Required for actions/checkout

# Cancel when pull request is updated for this node version
concurrency:
  group: ${{ github.head_ref }}-${{ github.run_id}}-${{ inputs.node-version }}-unit
  cancel-in-progress: true

env:
  # The desktop app's `electron` devDependency has an install script that
  # downloads a ~100 MB platform binary. Root `npm ci` runs it, and CI runs root
  # `npm ci` across roughly eight jobs per PR — none of which launch Electron
  # (the desktop tests are pure: assetPath.test.ts imports only node:path, and
  # the bundle step needs no runtime). Skip the download; anyone who needs the
  # binary locally gets it from a normal `npm install`, or `npm rebuild electron`.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  test:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: built-artifacts
          path: .
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Run tests
        # The examples package takes about as long as every other package
        # together (~155s, mostly real waits rather than CPU), so it runs beside
        # the rest instead of after them. The root `test` script stays the one
        # list of packages; this only splits it. One job, so the required check
        # names do not change.
        run: |
          examples=packages/aws-durable-execution-sdk-js-examples
          rest=$(node -e '
            const cmds = require("./package.json").scripts.test.split(" && ");
            const rest = cmds.filter((c) => c !== `npm run test -w ${process.argv[1]}`);
            if (rest.length !== cmds.length - 1) {
              throw new Error("examples tests not found in the root test script");
            }
            console.log(rest.join(" && "));
          ' "$examples")

          npm run test -w "$examples" > examples-test.log 2>&1 &
          examples_pid=$!

          rest_status=0
          bash -c "$rest" || rest_status=$?
          examples_status=0
          wait "$examples_pid" || examples_status=$?

          echo "::group::Examples tests (exit $examples_status)"
          cat examples-test.log
          echo "::endgroup::"
          if [ "$examples_status" -ne 0 ]; then
            echo "::error::Examples tests failed; see the 'Examples tests' group above"
          fi
          [ "$rest_status" -eq 0 ] && [ "$examples_status" -eq 0 ]
