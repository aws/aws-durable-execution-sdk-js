name: Unit Tests

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

permissions:
  contents: read # Required for actions/checkout

# Cancel when pull request is updated for this node version
concurrency:
  group: ${{ github.head_ref }}-${{ github.run_id}}-${{ inputs.node-version }}-unit
  cancel-in-progress: true

env:
  # The desktop app's `electron` devDependency has an install script that
  # downloads a ~100 MB platform binary. Root `npm ci` runs it, and CI runs root
  # `npm ci` across roughly eight jobs per PR — none of which launch Electron
  # (the desktop tests are pure: assetPath.test.ts imports only node:path, and
  # the bundle step needs no runtime). Skip the download; anyone who needs the
  # binary locally gets it from a normal `npm install`, or `npm rebuild electron`.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # Packages are split across runners by measured Jest time (~35-40s per shard).
  # Running two Jest runs on one 4-CPU runner was tried: they starved each
  # other and tests hit their 5s timeouts.
  #   examples: examples ~26s
  #   testing:  sdk ~7s, testing ~29s
  #   extras:   extras ~26s, microvm-worker ~7s
  #   rest:     everything else, otel ~31s the largest
  shard:
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [examples, testing, extras, rest]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: built-artifacts
          path: .
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Run tests
        # The root `test` script stays the one list of packages; this only
        # splits it. `rest` takes whatever the named shards do not, so a new
        # package is always tested. A named package missing from the script
        # fails the step.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cmds=$(node -e '
            const cmd = (pkg) => `npm run test -w packages/${pkg}`;
            const named = {
              examples: ["aws-durable-execution-sdk-js-examples"],
              testing: [
                "aws-durable-execution-sdk-js",
                "aws-durable-execution-sdk-js-testing",
              ],
              extras: [
                "aws-durable-execution-sdk-js-extras",
                "aws-durable-execution-sdk-js-microvm-worker",
              ],
            };
            const all = require("./package.json").scripts.test.split(" && ");
            const taken = Object.values(named).flat().map(cmd);
            for (const c of taken) {
              if (!all.includes(c)) throw new Error(`not in the root test script: ${c}`);
            }
            const shard = named[process.env.SHARD]?.map(cmd)
              ?? all.filter((c) => !taken.includes(c));
            if (shard.length === 0) throw new Error(`empty shard: ${process.env.SHARD}`);
            console.log(shard.join(" && "));
          ')
          bash -e -c "$cmds"

  # Keeps the `test` check name that branch rules require. `always()` so a
  # failed shard fails this job instead of skipping it, since a skipped
  # required check counts as passing.
  test:
    needs: shard
    if: always()
    # A GitHub-hosted runner: this job does 1s of work with no checkout and no
    # secrets, and a CodeBuild runner took ~20s to start for it.
    runs-on: ubuntu-latest
    steps:
      - name: Check every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "Shards: $RESULT"
          [ "$RESULT" = "success" ]
