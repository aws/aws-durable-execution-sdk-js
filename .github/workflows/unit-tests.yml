name: Unit Tests

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

permissions:
  contents: read # Required for actions/checkout

# Cancel when pull request is updated for this node version
concurrency:
  group: ${{ github.head_ref }}-${{ github.run_id}}-${{ inputs.node-version }}-unit
  cancel-in-progress: true

env:
  # The desktop app's `electron` devDependency has an install script that
  # downloads a ~100 MB platform binary. Root `npm ci` runs it, and CI runs root
  # `npm ci` across roughly eight jobs per PR — none of which launch Electron
  # (the desktop tests are pure: assetPath.test.ts imports only node:path, and
  # the bundle step needs no runtime). Skip the download; anyone who needs the
  # binary locally gets it from a normal `npm install`, or `npm rebuild electron`.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # The examples package takes about as long as every other package together
  # (~155s), so it gets its own runner. Running it beside the others on one
  # 4-CPU runner was tried: the two Jest runs starved each other and tests hit
  # their 5s timeouts.
  shard:
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [examples, rest]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: built-artifacts
          path: .
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Run tests
        # The root `test` script stays the one list of packages; this only
        # splits it, and fails if the examples entry is not in it.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cmds=$(node -e '
            const examples = "npm run test -w packages/aws-durable-execution-sdk-js-examples";
            const all = require("./package.json").scripts.test.split(" && ");
            if (!all.includes(examples)) {
              throw new Error("examples tests not found in the root test script");
            }
            const shard = process.env.SHARD === "examples"
              ? [examples]
              : all.filter((c) => c !== examples);
            console.log(shard.join(" && "));
          ')
          bash -e -c "$cmds"

  # Keeps the `test` check name that branch rules require. `always()` so a
  # failed shard fails this job instead of skipping it, since a skipped
  # required check counts as passing.
  test:
    needs: shard
    if: always()
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - name: Check every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "Shards: $RESULT"
          [ "$RESULT" = "success" ]
