name: Unit Tests

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

permissions:
  contents: read # Required for actions/checkout

# Cancel when pull request is updated for this node version
concurrency:
  group: ${{ github.head_ref }}-${{ github.run_id}}-${{ inputs.node-version }}-unit
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: built-artifacts
          path: .
      - name: Install dependencies
        run: npm ci
      - name: Install webview-ui dependencies
        # webview-ui is a nested package outside the root workspaces glob
        # (packages/*), so the root `npm ci` never installs it — and its suites
        # need dependencies (monaco-editor) that exist only in its own list.
        # Without this the root `test` script reaches it via `npm --prefix` and
        # fails with "Cannot find module 'monaco-editor'".
        # vscode-extension-release.yml already does the same for the same reason.
        working-directory: packages/aws-durable-execution-sdk-js-insight-vscode/webview-ui
        run: npm ci
      - name: Run tests
        run: npm run test
