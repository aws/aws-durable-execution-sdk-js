name: Build

on:
  push:
    branches: ["main", "v1.x"]
  pull_request:
    branches: ["main", "v1.x"]
  pull_request_target:
    types: [labeled, unlabeled]
    branches: ["main", "v1.x"]

permissions:
  contents: read # This is required for actions/checkout

# Cancel when pull request is updated
concurrency:
  group: ${{ github.event_name }}-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true

env:
  # The desktop app's `electron` devDependency has an install script that
  # downloads a ~100 MB platform binary. Root `npm ci` runs it, and CI runs root
  # `npm ci` across roughly eight jobs per PR — none of which launch Electron
  # (the desktop tests are pure: assetPath.test.ts imports only node:path, and
  # the bundle step needs no runtime). Skip the download; anyone who needs the
  # binary locally gets it from a normal `npm install`, or `npm rebuild electron`.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  lint-commits:
    # Note: To re-run `lint-commits` after fixing the PR title, close-and-reopen the PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
      - name: Check PR title
        run: |
          node "$GITHUB_WORKSPACE/.github/workflows/lintcommit.js"

  # Legal metadata on every workspace package: a declared `license`, and for the
  # released packages the LICENSE/NOTICE files themselves, listed in `files` so
  # npm actually packs them. The ESLint plugin shipped five versions to npm with
  # no `license` field before anyone noticed (fixed by hand in d7bbfc3); this is
  # the gate that catches it. Pure file reads, so no `npm ci` and no build.
  legal-files:
    needs: lint-commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Check legal files
        run: node .github/workflows/scripts/legal/check-legal-files.js
      - name: Test the checker itself
        run: node --test .github/workflows/scripts/legal/*.test.js

  build:
    needs: lint-commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: built-artifacts
          path: |
            packages/**/dist*/*
            package.json
            package-lock.json

  # Typecheck and actually *bundle* both Workflow Insight hosts.
  #
  # Neither host package is in the root `build` script, so without this job
  # main.ts, preload.ts and the two esbuild configs are only ever typechecked —
  # an unresolvable external or a renamed entry point would ship unnoticed. The
  # hostAgnostic guard catches `vscode` leaking into the shared modules, but that
  # is a source-level check and cannot see a bundler failure.
  #
  # webview-ui gets its own `npm ci`: it is a nested package outside the root
  # workspaces glob, so the root install never covers it, and it is the one place
  # the renderer is typechecked at all.
  insight-hosts:
    needs: lint-commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install webview-ui dependencies
        working-directory: packages/aws-durable-execution-sdk-js-insight-vscode/webview-ui
        run: npm ci
      - name: Lint (boundary rules)
        # The no-restricted-imports rules that forbid reaching into a sibling package
        # by relative path, and forbid a host's API leaking into shared code. Review
        # of #809 noted these had no CI gate at all -- eslint previously ran only via
        # lint-staged on pre-commit, which `--no-verify` bypasses. The hostAgnostic
        # tests cover the same ground, deliberately: the rules give the earliest
        # signal, the tests are the backstop, and neither is the only gate.
        run: npm run lint
      - name: Typecheck core and both hosts
        run: npm run typecheck:hosts
      - name: Typecheck the renderer
        working-directory: packages/aws-durable-execution-sdk-js-insight-vscode/webview-ui
        run: npx tsc --noEmit
      - name: Bundle the VS Code extension (renderer + extension host)
        run: npm run build -w packages/aws-durable-execution-sdk-js-insight-vscode
      - name: Bundle the desktop app
        run: npm run build -w packages/aws-durable-execution-sdk-js-insight-desktop
      - name: Bundle the MCP server
        run: npm run build -w packages/aws-durable-execution-sdk-js-insight-mcp

  unit-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    uses: "./.github/workflows/unit-tests.yml"
    with:
      node-version: ${{ matrix.node-version }}

  integration-tests:
    needs: build
    # Skip integration tests for PRs from forked repos (no access to secrets)
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    uses: "./.github/workflows/integration-tests.yml"
    with:
      node-version: ${{ matrix.node-version }}
    secrets: inherit

  capacity-provider-tests:
    needs: build
    # Skip for PRs from forked repos (no access to secrets)
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    uses: "./.github/workflows/capacity-provider-tests.yml"
    with:
      node-version: "24.x"
    secrets: inherit

  # Always succeed for external PRs to allow merging
  external-pr-status:
    if: github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: External PR Status
        run: |
          echo "✅ External PR - Integration tests skipped for security"
          echo "Maintainer: Add 'safe-to-merge' label and use squash & merge"
      - name: Check for bypass label
        uses: actions/github-script@v9
        with:
          script: |
            // Fetch current labels via API (event payload has stale data)
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const labelNames = labels.map(label => label.name);
            const hasBypassLabel = labelNames.includes('safe-to-merge');

            console.log(`Current labels: ${labelNames.join(', ')}`);

            if (hasBypassLabel) {
              console.log('✅ Maintainer approved bypass with safe-to-merge label');
            } else {
              console.log('⚠️  No bypass label - PR cannot be merged until maintainer adds safe-to-merge label');
              core.setFailed('External PR requires maintainer approval via safe-to-merge label');
            }
