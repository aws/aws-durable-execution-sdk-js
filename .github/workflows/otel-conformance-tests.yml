name: Temporary JS957 wire diagnostic (never merge)

on:
  workflow_dispatch:

concurrency:
  group: otel-conformance
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  probe:
    permissions:
      actions: write
      contents: read
      id-token: write
    uses: ./.github/workflows/js957-wire-suite.yml
    with:
      sdk_ref: ${{ github.sha }}
    secrets:
      CONFORMANCE_TEST_ROLE_ARN: ${{ secrets.TEST_ROLE_ARN }}
      CONFORMANCE_TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
      CONFORMANCE_TEST_LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}

  collect:
    needs: probe
    if: always()
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: javascript-otel-*-otel-execution-*
          path: ${{ runner.temp }}/wire-artifacts
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TEST_ROLE_ARN }}
          role-session-name: js957WireObservation
          aws-region: us-west-2
          allowed-account-ids: ${{ secrets.TEST_ACCOUNT_ID }}
      - name: Read selected case11 tracing metadata
        env:
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
        run: |
          python3 .github/workflows/scripts/collect-wire-observations.py \
            --artifacts "$RUNNER_TEMP/wire-artifacts" \
            --output "$RUNNER_TEMP/wire-proof.json"
      - name: Upload selected metadata only
        if: always()
        uses: actions/upload-artifact@v8
        with:
          name: js957-wire-observations-${{ github.run_id }}
          path: ${{ runner.temp }}/wire-proof.json
          if-no-files-found: error
