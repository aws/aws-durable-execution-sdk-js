name: Temporary JS957 wire diagnostic (never merge)

on:
  workflow_dispatch:

concurrency:
  group: otel-conformance
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  probe:
    permissions:
      actions: write
      contents: read
      id-token: write
    uses: aws/aws-durable-execution-conformance-tests/.github/workflows/opentelemetry-suite.yml@e48ac54502d3c14e2e3fa216c5e200dbb4c14ac2
    with:
      language: javascript
      resource_prefix: js
      sdk_repository: aws/aws-durable-execution-sdk-js
      sdk_ref: ${{ github.sha }}
      conformance_repository: aws/aws-durable-execution-conformance-tests
      conformance_test_sha: a628f5589bbf067a441696c792ab3023c0d0899b
      checkout_sdk: true
      suite: otel-execution
      case_count: 20
      runs_on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
      examples_dir: .build/durable-sdk/packages/aws-durable-execution-sdk-js-conformance-tests-otel
      setup_command: |
        bash "$SDK_CHECKOUT/.github/workflows/scripts/setup-node22.test.sh"
        source "$SDK_CHECKOUT/.github/workflows/scripts/setup-node22.sh"
      prepare_command: |
        export ELECTRON_SKIP_BINARY_DOWNLOAD=1
        cd "$SDK_CHECKOUT"
        npm ci
        npm run build --workspace packages/aws-durable-execution-sdk-js
        npm run build --workspace packages/aws-durable-execution-sdk-js-otel
        npm run typecheck --workspace packages/aws-durable-execution-sdk-js-conformance-tests-otel
        npm run build --workspace packages/aws-durable-execution-sdk-js-conformance-tests-otel
      adot_release_repository: aws-observability/aws-otel-js-instrumentation
      collector_compatible_runtime: nodejs22.x
      collector_otlp_endpoint: http://localhost:4318
      aws_region: us-west-2
    secrets:
      CONFORMANCE_TEST_ROLE_ARN: ${{ secrets.TEST_ROLE_ARN }}
      CONFORMANCE_TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
      CONFORMANCE_TEST_LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}

  collect:
    needs: probe
    if: always()
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: javascript-otel-*-otel-execution-*
          path: ${{ runner.temp }}/wire-artifacts
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TEST_ROLE_ARN }}
          role-session-name: js957WireObservation
          aws-region: us-west-2
          allowed-account-ids: ${{ secrets.TEST_ACCOUNT_ID }}
      - name: Read selected case11 tracing metadata
        env:
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
        run: |
          python3 .github/workflows/scripts/collect-wire-observations.py \
            --artifacts "$RUNNER_TEMP/wire-artifacts" \
            --output "$RUNNER_TEMP/wire-proof.json"
      - name: Upload selected metadata only
        if: always()
        uses: actions/upload-artifact@v8
        with:
          name: js957-wire-observations-${{ github.run_id }}
          path: ${{ runner.temp }}/wire-proof.json
          if-no-files-found: error
