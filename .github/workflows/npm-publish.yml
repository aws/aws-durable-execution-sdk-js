# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: npm publish

permissions:
  contents: read
on:
  release:
    types: [published]
env:
  # The desktop app's `electron` devDependency has an install script that
  # downloads a ~100 MB platform binary. Root `npm ci` runs it, and CI runs root
  # `npm ci` across roughly eight jobs per PR — none of which launch Electron
  # (the desktop tests are pure: assetPath.test.ts imports only node:path, and
  # the bundle step needs no runtime). Skip the download; anyone who needs the
  # binary locally gets it from a normal `npm install`, or `npm rebuild electron`.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    # A repository admin sets the required reviewers of this environment. The
    # job then waits for one of them to approve before it can publish. The
    # reviewer checks that the release tag is on main or v1.x.
    environment: npm-publish
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # Skip the install scripts of dependencies. This job can publish to npm, so
      # it must not run third-party code that the build does not need. The
      # build and the tests pass without those scripts.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test
      # The same package checks that run on every pull request. They catch a
      # tarball that misses a declared file or has wrong type resolution.
      - name: Verify every package ships the files its package.json declares
        run: node .github/workflows/scripts/test-publish/verify-declared-files-shipped.mjs
      - name: Check the core package with attw and publint
        run: npm run check:package -w packages/aws-durable-execution-sdk-js
      - name: Make script executable
        run: chmod +x ./.github/workflows/iterate-publish-npm.sh
      - name: iterate and publish
        # The dist-tag is derived from each package's version (see
        # iterate-publish-npm.sh), so the GitHub Release prerelease flag is
        # intentionally not passed.
        env:
          # Widen the post-publish dist-tag verification window to absorb npm
          # registry/CDN propagation lag (default is 5 attempts x 10s = 50s,
          # which can false-fail an otherwise-successful publish).
          DIST_TAG_VERIFY_ATTEMPTS: "10"
          DIST_TAG_VERIFY_DELAY: "15"
        run: ./.github/workflows/iterate-publish-npm.sh
        shell: bash
