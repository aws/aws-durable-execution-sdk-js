name: Issue Triage

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  triage:
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/issue-triage.yml@288e4317948ca778ebf01acca9342d8b898a1dc2
    with:
      # CodeBuild-hosted runner in the JavaScript testing account; the label must
      # match the CodeBuild project name.
      runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit
