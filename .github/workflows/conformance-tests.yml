name: Conformance Tests

# Full-integration conformance run: builds the JS handlers, installs the pinned
# language-agnostic runner from PyPI, then deploys + invokes + validates one SAM
# stack per suite. Suites are discovered from the package's template_<suite>.yaml
# files (see scripts/discover_suites.py) and each runs as its own parallel matrix
# job, so adding a suite only requires shipping its template + handlers.

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/aws-durable-execution-sdk-js/**"
      - "packages/aws-durable-execution-sdk-js-conformance-tests/**"
      - ".github/workflows/conformance-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.ref_name || github.run_id }}-conformance
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Required for AWS OIDC credentials

jobs:
  discover_suites:
    name: discover conformance suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.discover.outputs.suites }}
    steps:
      - uses: actions/checkout@v6

      - name: Discover suites from templates
        id: discover
        working-directory: packages/aws-durable-execution-sdk-js-conformance-tests
        run: echo "suites=$(python3 scripts/discover_suites.py)" >> "$GITHUB_OUTPUT"

  conformance:
    name: conformance (${{ matrix.suite }})
    needs: discover_suites
    runs-on: ubuntu-latest
    # Global lock per suite stack: runs from different branches/PRs share the
    # persistent conformance-js-<suite> stacks, so deploys to the same stack
    # must never overlap. Queued (not cancelled) so every run still executes.
    concurrency:
      group: conformance-stack-${{ matrix.suite }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.discover_suites.outputs.suites) }}
    defaults:
      run:
        working-directory: packages/aws-durable-execution-sdk-js-conformance-tests
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install monorepo dependencies
        working-directory: .
        run: npm ci

      - name: Build SDK
        working-directory: .
        run: npm run build -w @aws/durable-execution-sdk-js

      - name: Build conformance handlers
        run: npm run build # rollup -> dist/<handler>.js

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install conformance runner
        run: pip install "git+https://github.com/aws/aws-durable-execution-conformance-tests.git@main#subdirectory=packages/aws-durable-execution-conformance-tests"

      - name: Get AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # SAM-capable deploy role (has CloudFormation/S3/IAM), same role the
          # SAM-based integration tests assume. NOT ACTIONS_INTEGRATION_ROLE_NAME
          # (the legacy direct-Lambda-API role without CloudFormation rights).
          role-to-assume: ${{ secrets.TEST_ROLE_ARN }}
          role-session-name: githubConformanceTest
          aws-region: ${{ vars.AWS_REGION }}

      - name: Inject Lambda execution role into template
        env:
          ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "TEST_LAMBDA_EXECUTION_ROLE_ARN not set; template will create its own role."
            exit 0
          fi
          # Point every function at the pre-existing execution role and drop the
          # self-created DurableFunctionRole. Mutates only the CI checkout; the
          # checked-in template stays self-contained for local runs.
          python3 scripts/inject_execution_role.py \
            --template template_${{ matrix.suite }}.yaml \
            --role-arn "$ROLE_ARN"

      - name: Compute stack-safe suite slug
        run: |
          # CloudFormation stack names allow only [a-zA-Z][-a-zA-Z0-9]*;
          # suite names like wait_for_condition contain underscores.
          echo "SUITE_SLUG=$(echo '${{ matrix.suite }}' | tr '_' '-')" >> "$GITHUB_ENV"

      - name: Run conformance suite
        run: |
          python -m aws_durable_execution_conformance_tests.app \
            --template template_${{ matrix.suite }}.yaml \
            --language js \
            --suite ${{ matrix.suite }} \
            --name conformance-js-${SUITE_SLUG} \
            --region ${{ vars.AWS_REGION }} \
            --history-dir history-${{ matrix.suite }} \
            --report junit \
            --report-file report-${{ matrix.suite }} \
            --no-cleanup

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report-${{ matrix.suite }}
          path: |
            packages/aws-durable-execution-sdk-js-conformance-tests/report-${{ matrix.suite }}.xml
            packages/aws-durable-execution-sdk-js-conformance-tests/history-${{ matrix.suite }}/
          if-no-files-found: warn
