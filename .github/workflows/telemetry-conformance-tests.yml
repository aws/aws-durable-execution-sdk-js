name: Telemetry Conformance Tests

# SDK handlers and builds live here. The shared workflow deploys and validates them.
# Include the parent PR branch while this change is stacked on PR #1046.
# Remove that branch filter when retargeting this PR to main.

on:
  pull_request:
    branches:
      - main
      - feat/conformance-tests-telemetry
    paths:
      - "packages/aws-durable-execution-sdk-js/**"
      - "packages/aws-durable-execution-sdk-js-telemetry-exporter/**"
      - "packages/aws-durable-execution-sdk-js-conformance-tests-telemetry/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/telemetry-conformance-tests.yml"
      - ".github/workflows/scripts/setup-node22*.sh"
  push:
    branches: [main]
    paths:
      - "packages/aws-durable-execution-sdk-js/**"
      - "packages/aws-durable-execution-sdk-js-telemetry-exporter/**"
      - "packages/aws-durable-execution-sdk-js-conformance-tests-telemetry/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/telemetry-conformance-tests.yml"
      - ".github/workflows/scripts/setup-node22*.sh"
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: true
        default: us-west-2
        type: string
      conformance_test_ref:
        description: Optional conformance test commit SHA or branch name. Empty uses the shared workflow commit.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  telemetry:
    # 1. Run for non-PR events, such as pushes and manual invocations.
    # 2. For PRs, run only same-repo branches from non-Dependabot actors. Forked PRs and Dependabot cannot read secrets.
    if: github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    uses: aws/aws-durable-execution-conformance-tests/.github/workflows/telemetry-suite.yml@21fd4c244d9260d34b10cd6ee52c877846e9a458
    with:
      language: js
      resource_prefix: js
      sdk_repository: aws/aws-durable-execution-sdk-js
      sdk_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Path relative to the conformance workspace, where this repo is checked out at .build/durable-sdk.
      examples_dir: .build/durable-sdk/packages/aws-durable-execution-sdk-js-conformance-tests-telemetry
      conformance_test_ref: ${{ inputs.conformance_test_ref }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
      runs_on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
      timeout_minutes: 30
      setup_command: |
        bash "$SDK_CHECKOUT/.github/workflows/scripts/setup-node22.test.sh"
        source "$SDK_CHECKOUT/.github/workflows/scripts/setup-node22.sh"
      prepare_command: |
        # The telemetry desktop app's electron devDependency downloads a ~100 MB binary that
        # nothing in this job launches.
        export ELECTRON_SKIP_BINARY_DOWNLOAD=1
        cd "$SDK_CHECKOUT"
        npm ci
        npm run build --workspace packages/aws-durable-execution-sdk-js
        npm run build --workspace packages/aws-durable-execution-sdk-js-telemetry-exporter
        npm test --workspace packages/aws-durable-execution-sdk-js-conformance-tests-telemetry
        npm run build --workspace packages/aws-durable-execution-sdk-js-conformance-tests-telemetry
    secrets:
      CONFORMANCE_TEST_ROLE_ARN: ${{ secrets.TEST_ROLE_ARN }}
      CONFORMANCE_TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
      CONFORMANCE_TEST_LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}
