name: Integration Tests

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

# Serialize updates to the shared runtime stack.
concurrency:
  group: runtime-${{ inputs.node-version }}-integ
  cancel-in-progress: false

env:
  # The desktop app's `electron` devDependency has an install script that
  # downloads a ~100 MB platform binary. Root `npm ci` runs it, and CI runs root
  # `npm ci` across roughly eight jobs per PR — none of which launch Electron
  # (the desktop tests are pure: assetPath.test.ts imports only node:path, and
  # the bundle step needs no runtime). Skip the download; anyone who needs the
  # binary locally gets it from a normal `npm install`, or `npm rebuild electron`.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write # Required for AWS credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Get AWS Credentials
        id: credentials
        if: github.actor != 'nektos/act'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "${{ secrets.TEST_ROLE_ARN }}"
          role-session-name: githubIntegrationTest
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: built-artifacts
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Deploy functions with SAM
        id: deploy-functions
        env:
          LAMBDA_ENDPOINT: ${{ secrets.LAMBDA_ENDPOINT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
          TEST_LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}
        run: node .github/workflows/scripts/integration-test/integration-test.js --deploy-only --runtime ${{ inputs.node-version }}

  jest-integration-test:
    needs: deploy
    runs-on: ubuntu-latest
    name: Jest Integration Tests
    permissions:
      contents: read
      id-token: write # Required for AWS credentials

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Get AWS Credentials
        id: credentials
        if: github.actor != 'nektos/act'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "${{ secrets.TEST_ROLE_ARN }}"
          role-session-name: githubIntegrationTest
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: built-artifacts
          path: .

      - name: Install dependencies
        run: |
          npm ci

      - name: Run Jest integration tests
        env:
          LAMBDA_ENDPOINT: ${{ secrets.LAMBDA_ENDPOINT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node .github/workflows/scripts/integration-test/integration-test.js --test-only --runtime ${{ inputs.node-version }}
