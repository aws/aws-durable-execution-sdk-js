name: Test Pre-release Version Validation

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/workflows/iterate-publish-npm.sh'
      - '.github/workflows/npm-publish.yml'
  workflow_dispatch:

jobs:
  test-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create test package with pre-release version
        run: |
          mkdir -p test-packages/test-package
          cd test-packages/test-package
          cat > package.json << 'EOF'
          {
            "name": "test-package",
            "version": "1.0.0-alpha.1"
          }
          EOF

      - name: Test validation blocks pre-release to latest
        run: |
          cd test-packages/test-package
          chmod +x ../../.github/workflows/iterate-publish-npm.sh
          
          # Source the script to access the check_prerelease_version function
          source ../../.github/workflows/iterate-publish-npm.sh
          
          # Set PRERELEASE to false (latest tag)
          PRERELEASE=false
          
          # Test should fail (exit 1) for pre-release version to latest
          if check_prerelease_version "1.0.0-alpha.1" "test-package"; then
            echo "ERROR: Script should have failed for pre-release version with latest tag"
            exit 1
          else
            echo "SUCCESS: Script correctly blocked pre-release version"
          fi

      - name: Test validation allows pre-release to beta
        run: |
          cd test-packages/test-package
          
          # Source the script to access the check_prerelease_version function
          source ../../.github/workflows/iterate-publish-npm.sh
          
          # Set PRERELEASE to true (beta tag)
          PRERELEASE=true
          
          # Test should pass (exit 0) for pre-release version to beta
          if check_prerelease_version "1.0.0-alpha.1" "test-package"; then
            echo "SUCCESS: Script correctly allows pre-release with beta tag"
          else
            echo "ERROR: Script should allow pre-release version with beta tag"
            exit 1
          fi