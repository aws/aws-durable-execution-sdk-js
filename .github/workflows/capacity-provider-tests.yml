name: Capacity Provider Tests

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

env:
  # The desktop app's `electron` devDependency has an install script that
  # downloads a ~100 MB platform binary. Root `npm ci` runs it, and CI runs root
  # `npm ci` across roughly eight jobs per PR — none of which launch Electron
  # (the desktop tests are pure: assetPath.test.ts imports only node:path, and
  # the bundle step needs no runtime). Skip the download; anyone who needs the
  # binary locally gets it from a normal `npm install`, or `npm rebuild electron`.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  deploy-capacity-provider:
    permissions:
      contents: read
      id-token: write # Required for AWS credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Get AWS Credentials
        id: credentials
        if: github.actor != 'nektos/act'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "${{ secrets.TEST_ROLE_ARN }}"
          role-session-name: githubIntegrationTest
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: built-artifacts
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Deploy all capacity provider functions
        id: deploy-capacity-providers
        env:
          LAMBDA_ENDPOINT: ${{ secrets.LAMBDA_ENDPOINT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_NUMBER: ${{ github.event.number }}
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
          TEST_LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}
          TEST_CAPACITY_PROVIDER_ARN: ${{ secrets.TEST_CAPACITY_PROVIDER_ARN }}
        run: node .github/workflows/scripts/integration-test/integration-test.js --deploy-only --capacity-provider-only --runtime ${{ inputs.node-version }}

  test-capacity-provider:
    needs: deploy-capacity-provider
    runs-on: ubuntu-latest
    name: Test Capacity Provider Functions
    permissions:
      contents: read
      id-token: write # Required for AWS credentials

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Get AWS Credentials
        id: credentials
        if: github.actor != 'nektos/act'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "${{ secrets.TEST_ROLE_ARN }}"
          role-session-name: githubIntegrationTest
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: built-artifacts
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Test all capacity provider functions
        env:
          LAMBDA_ENDPOINT: ${{ secrets.LAMBDA_ENDPOINT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_NUMBER: ${{ github.event.number }}
        run: |
          node .github/workflows/scripts/integration-test/integration-test.js --test-only --capacity-provider-only --runtime ${{ inputs.node-version }}

  cleanup-capacity-provider:
    if: always()
    needs: test-capacity-provider
    runs-on: ubuntu-latest
    name: Clean up capacity provider functions
    permissions:
      contents: read
      id-token: write # Required for AWS credentials

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Get AWS Credentials
        id: credentials
        if: github.actor != 'nektos/act'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "${{ secrets.TEST_ROLE_ARN }}"
          role-session-name: githubIntegrationTest
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: built-artifacts
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Clean up capacity provider functions
        env:
          LAMBDA_ENDPOINT: ${{ secrets.LAMBDA_ENDPOINT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_NUMBER: ${{ github.event.number }}
        run: |
          node .github/workflows/scripts/integration-test/integration-test.js --cleanup-only --capacity-provider-only --runtime ${{ inputs.node-version }}
